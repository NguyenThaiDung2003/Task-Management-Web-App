name: Deploy Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 103.75.182.135
          port: 22
          username: root
          password: jshcm123aA@
          script: |
            # 1. Chuyển vào thư mục dự án
            cd /var/www/express_server_basic_demo || exit 1

            # 2. Cấu hình môi trường NVM / Node / PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 3. Pull code mới nhất (reset nhẹ để tránh xung đột file local nếu có)
            git fetch origin master
            git reset --hard origin/master

            # 4. Cài đặt dependencies (dùng npm ci cho môi trường production nếu có package-lock.json)
            npm install

            # 5. Khởi chạy / Khởi động lại ứng dụng với PM2 (Không dùng 'pm2 delete all' để tránh sập app ngoài ý muốn)
            pm2 start main.js --name "express-app"

            # 6. Lưu trạng thái PM2
            pm2 save